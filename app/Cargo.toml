[package]
name = "section-response"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "section-response"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
serde_json = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
